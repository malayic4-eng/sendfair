name: WorldRemit quotes

on:
  schedule:
    # Hourly (WorldRemit rates move less often than the Wise feed).
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worldremit
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install playwright --no-save
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Scrape WorldRemit
        run: node scripts/fetch-worldremit.mjs
      - name: Commit if changed
        run: |
          git config user.name "sendfair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/worldremit-quotes.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update WorldRemit quotes (automatic)"
            git pull --rebase
            git push
          fi
