name: Submit pages to Bing (IndexNow)

on:
  schedule:
    - cron: "41 5 * * *"   # once a day
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the key file is live
        run: curl -sS -D - https://sendfair.africa/058640bd53ad01bd934b671764bc57dd.txt
      - run: node scripts/indexnow.mjs
