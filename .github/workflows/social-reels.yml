name: Daily Reel

on:
  schedule:
    # 17:00 Africa/Nairobi (14:00 UTC): UK lunchtime, US East Coast morning.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render and log, do not publish
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: social-reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test the Reel pipeline
        run: node scripts/test-reel.mjs
      - name: Build today's plan
        run: node scripts/social-content.mjs
      - name: Render the Reel, cover, image and captions
        run: node scripts/social-reel.mjs
      - name: Read the date
        id: date
        run: echo "date=$(node -e 'console.log(require("./data/social/plan.json").date)')" >> "$GITHUB_OUTPUT"
      - name: Upload to Cloudflare R2 (optional)
        if: ${{ vars.R2_PUBLIC_BASE != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          npx wrangler@latest r2 object put "$R2_BUCKET/social/${{ steps.date.outputs.date }}/reel.mp4" --file "data/social/reels/${{ steps.date.outputs.date }}/reel.mp4"
          npx wrangler@latest r2 object put "$R2_BUCKET/social/${{ steps.date.outputs.date }}/cover.png" --file "data/social/reels/${{ steps.date.outputs.date }}/cover.png"
          npx wrangler@latest r2 object put "$R2_BUCKET/social/${{ steps.date.outputs.date }}/image.png" --file "data/social/reels/${{ steps.date.outputs.date }}/image.png"
      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          DRY_RUN: "1"
        run: node scripts/social-publish.mjs
      - name: Publish to Instagram, Facebook and (if enabled) TikTok
        if: ${{ vars.R2_PUBLIC_BASE != '' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GRAPH_VERSION: v22.0
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          REEL_URL: ${{ vars.R2_PUBLIC_BASE }}/social/${{ steps.date.outputs.date }}/reel.mp4
          COVER_URL: ${{ vars.R2_PUBLIC_BASE }}/social/${{ steps.date.outputs.date }}/cover.png
          IMAGE_URL: ${{ vars.R2_PUBLIC_BASE }}/social/${{ steps.date.outputs.date }}/image.png
          DRY_RUN: "0"
        run: node scripts/social-publish.mjs
      - name: Keep the Reel for hand-posting (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.date.outputs.date }}
          path: |
            data/social/reels/${{ steps.date.outputs.date }}/
            data/social/tiktok/${{ steps.date.outputs.date }}/
          retention-days: 30
      - name: Commit the social log
        if: always()
        run: |
          git config user.name "sendfair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/social/log.json
          if git diff --cached --quiet; then
            echo "No log change"
          else
            git commit -m "Update social log (automatic)"
            git pull --rebase
            git push
          fi
