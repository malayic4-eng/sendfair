name: Daily Reel

on:
  schedule:
    # 20:30 Africa/Nairobi (17:30 UTC): evening in East Africa, 17:30 in the UK, 12:30 on the US
    # East Coast (an hour later in the summer). GitHub can start scheduled runs late; that's fine.
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render and log, do not publish
        type: boolean
        default: true
      force_reel:
        description: Test only - post the Reel to Instagram even on a carousel day (no Facebook, TikTok or image)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Wrangler 4 (the R2 upload) needs Node 22.12 or later.
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test the Reel pipeline
        run: node scripts/test-reel.mjs
      - name: Build today's plan
        env:
          FORCE_REEL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reel && '1' || '0' }}
        run: node scripts/social-content.mjs
      - name: Download background photos (Unsplash)
        run: node scripts/fetch-reel-photos.mjs
      - name: Download music beds
        continue-on-error: true
        run: |
          mkdir -p assets/music
          node -e 'for (const t of require("./data/social/music.json").tracks) console.log(t.file + " " + t.url)' | while read f u; do
            curl -sSfL --retry 2 -o "assets/music/$f" "$u" && echo "music: $f" || echo "music: could not download $f"
          done
      - name: Render the Reel, cover, image and captions
        run: node scripts/social-reel.mjs
      - name: Read the date
        id: date
        run: echo "date=$(node -e 'console.log(require("./data/social/plan.json").date)')" >> "$GITHUB_OUTPUT"
      - name: Upload to Cloudflare R2 (optional)
        if: ${{ vars.R2_PUBLIC_BASE != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # --remote: Wrangler 4 writes to a local simulated bucket without it. Pinned to major 4.
        run: |
          D="${{ steps.date.outputs.date }}"
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/social/$D/reel.mp4" --file "data/social/reels/$D/reel.mp4" --content-type video/mp4 --remote
          if [ -f "data/social/reels/$D/reel-music.mp4" ]; then npx --yes wrangler@4 r2 object put "$R2_BUCKET/social/$D/reel-music.mp4" --file "data/social/reels/$D/reel-music.mp4" --content-type video/mp4 --remote; fi
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/social/$D/cover.png" --file "data/social/reels/$D/cover.png" --content-type image/png --remote
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/social/$D/image.png" --file "data/social/reels/$D/image.png" --content-type image/png --remote
          # The manifest (final captions per platform: instagram, facebook, tiktok, youtube) next to
          # reel.mp4 and the cover, so the Worker can post the same Reel to TikTok and YouTube Shorts
          # from <R2_PUBLIC_BASE>/social/<date>/manifest.json.
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/social/$D/manifest.json" --file "data/social/reels/$D/manifest.json" --content-type application/json --remote
          # Carousel days: each slide is a public image for Instagram's carousel.
          # Instagram accepts JPEG only, so the .jpg slides are uploaded.
          for f in data/social/reels/$D/carousel-*.jpg; do
            [ -e "$f" ] || continue
            npx --yes wrangler@4 r2 object put "$R2_BUCKET/social/$D/$(basename "$f")" --file "$f" --content-type image/jpeg --remote
          done
          # Instagram fetches the video from this address, so make sure it is really there.
          curl -sfI "${{ vars.R2_PUBLIC_BASE }}/social/$D/reel.mp4" | grep -i -E "^(HTTP|content-type|content-length)"
          if ls data/social/reels/$D/carousel-*.jpg >/dev/null 2>&1; then curl -sfI "${{ vars.R2_PUBLIC_BASE }}/social/$D/carousel-1.jpg" | grep -i -E "^(HTTP|content-type)"; fi
      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          DRY_RUN: "1"
        run: node scripts/social-publish.mjs
      - name: Publish to Instagram, Facebook and (if enabled) TikTok
        if: ${{ vars.R2_PUBLIC_BASE != '' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GRAPH_VERSION: v22.0
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          REEL_URL: ${{ vars.R2_PUBLIC_BASE }}/social/${{ steps.date.outputs.date }}/reel.mp4
          COVER_URL: ${{ vars.R2_PUBLIC_BASE }}/social/${{ steps.date.outputs.date }}/cover.png
          IMAGE_URL: ${{ vars.R2_PUBLIC_BASE }}/social/${{ steps.date.outputs.date }}/image.png
          DRY_RUN: "0"
          FORCE_REEL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reel && '1' || '0' }}
        run: node scripts/social-publish.mjs
      - name: Keep the Reel for hand-posting (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.date.outputs.date }}
          path: |
            data/social/reels/${{ steps.date.outputs.date }}/
            data/social/tiktok/${{ steps.date.outputs.date }}/
          retention-days: 30
      - name: Commit the social log
        if: always()
        run: |
          git config user.name "sendfair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/social/log.json
          if git diff --cached --quiet; then
            echo "No log change"
          else
            git commit -m "Update social log (automatic) [skip ci]"
            git pull --rebase
            git push
          fi
