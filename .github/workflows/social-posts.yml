name: Social posts

on:
  schedule:
    # Daily (05:00 UTC) - generates the day's ready-to-post social queue.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-posts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate social queue
        run: node scripts/social-posts.mjs
      - name: Commit queue
        run: |
          git config user.name "sendfair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/social/queue.md
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update social queue (automatic)"
            git pull --rebase
            git push
          fi
