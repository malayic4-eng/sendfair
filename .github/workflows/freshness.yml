name: Flag stale pages

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check guide dates, house-price review, and Search Console when a token is set
        env:
          GSC_ACCESS_TOKEN: ${{ secrets.GSC_ACCESS_TOKEN }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
        run: node scripts/freshness.mjs
