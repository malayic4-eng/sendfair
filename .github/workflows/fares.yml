name: Flight prices by month

on:
  schedule:
    - cron: "23 6 * * 2" # Tuesday 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fares:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch monthly flight prices (Travelpayouts Data API)
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: node scripts/fetch-fares.mjs
      - name: Commit
        run: |
          git config user.name "sendfair-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/fares.json ] && git add data/fares.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update monthly flight prices"
          git pull --rebase
          git push
