name: Post to Facebook (legacy)

# Superseded by Daily Reel (social-reels.yml). Manual only: the old workflow regenerated the queue and
# posted to both networks, which is how the same post went out three times in two hours on 17 Nov.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-facebook
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate today's queue
        run: node scripts/social-posts.mjs
      - name: Post to Facebook Page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node scripts/post-facebook.mjs
      - name: Post to Instagram
        if: always()
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node scripts/post-instagram.mjs
