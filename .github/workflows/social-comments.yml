name: Social comments (for reply drafts)

# Daily: fetch the last 3 days of comments on our Facebook and Instagram posts and publish them to
# R2 as social/comments.json. The Worker page /admin/comments reads that file and drafts replies for
# the owner to approve and paste. Nothing is posted and nothing is committed.
on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC, 08:00 Nairobi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-comments
  cancel-in-progress: true

jobs:
  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Wrangler 4 (the R2 upload) needs Node 22.12 or later.
          node-version: 22
      - name: Test the comment parser
        run: node scripts/test-social-comments.mjs
      - name: Fetch recent comments
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GRAPH_VERSION: v22.0
        run: node scripts/social-comments.mjs
      - name: Upload to Cloudflare R2
        # Skipped without a public bucket, or when there was no token (keeps the last good file).
        if: ${{ vars.R2_PUBLIC_BASE != '' && hashFiles('data/social/tmp/comments.skip') == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # --remote: Wrangler 4 writes to a local simulated bucket without it. Pinned to major 4.
        # The bucket is public; the file holds only what is already public on the platforms.
        run: |
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/social/comments.json" --file data/social/tmp/comments.json --content-type "application/json; charset=utf-8" --cache-control "max-age=300" --remote
          curl -sfI "${{ vars.R2_PUBLIC_BASE }}/social/comments.json" | grep -i -E "^(HTTP|content-type)"
