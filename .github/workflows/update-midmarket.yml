name: Update rates

on:
  schedule:
    # Every 30 minutes. GitHub may start scheduled runs a few minutes late.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs overlap.
concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      WISE_API_TOKEN: ${{ secrets.WISE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch mid-market rates
        run: node scripts/fetch-midmarket.mjs
      - name: Fetch Wise comparison feed (only if WISE_API_TOKEN secret is set)
        if: ${{ env.WISE_API_TOKEN != '' }}
        run: node scripts/fetch-wise-feed.mjs
      - name: Correct the mid-market reference with Wise's own rates
        if: ${{ env.WISE_API_TOKEN != '' }}
        run: node scripts/mid-from-wise.mjs
      - name: Publish the Wise feed into today's quotes (with safety checks)
        if: ${{ env.WISE_API_TOKEN != '' }}
        run: node scripts/apply-wise-feed.mjs
      - name: Record history
        run: node scripts/record-history.mjs
      - name: Commit if changed
        run: |
          git add data/midmarket.json
          if [ -f data/mid-overrides.json ]; then git add data/mid-overrides.json; fi
          if [ -f data/wise-feed.json ]; then git add data/wise-feed.json; fi
          git add data/quotes.json data/history.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git config user.name "sendfair-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Update rates (automatic)"
            git pull --rebase
            git push
          fi
      # Last, and even when an earlier step failed: fails the run (so GitHub emails the owner) when the
      # Wise feed is older than 6 hours or empty, e.g. after the WISE_API_TOKEN expires.
      - name: Check the rate data is fresh
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_ALERT_EMAIL: ${{ secrets.OWNER_ALERT_EMAIL }}
          OWNER_ALERT_FROM: ${{ secrets.OWNER_ALERT_FROM }}
          OWNER_ALERT_WEBHOOK: ${{ secrets.OWNER_ALERT_WEBHOOK }}
        run: node scripts/check-data-fresh.mjs
