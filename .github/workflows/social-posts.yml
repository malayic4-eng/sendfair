name: Social posts (legacy queue)

# Superseded by Daily Reel (social-reels.yml), which posts one Reel a day and at most two image posts
# a week. This workflow is manual only so the old cadence cannot double-post.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-posts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate social queue
        run: node scripts/social-posts.mjs
      - name: Commit queue
        run: |
          git config user.name "sendfair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/social/queue.md
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update social queue (automatic) [skip ci]"
            git pull --rebase
            git push
          fi
